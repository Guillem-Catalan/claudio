name: Backfill Forecast V2 (All Open Deals)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Deals per batch"
        type: string
        default: "500"
      offset:
        description: "Start offset (0, 80, 160, ...)"
        type: string
        default: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Backfill forecast v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ secrets.AZURE_CLAUDE_DEPLOYMENT }}
          BACKFILL_MODEL: "claudio-claude-sonnet-4-6"
          FORCE_REWRITE: "true"
        run: python -m scripts.backfill_forecast_v2_all ${{ inputs.limit }} ${{ inputs.offset }}
