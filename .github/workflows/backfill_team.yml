name: "Backfill New Team"

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Team name (e.g., TIM, TELEKOM)"
        required: true
        type: string
      phase:
        description: "Phase to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - sync
          - context
          - snapshot
      limit:
        description: "Max deals per phase (default 50)"
        required: false
        default: "50"
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Backfill team
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ secrets.AZURE_CLAUDE_DEPLOYMENT }}
          MODJO_API_KEY: ${{ secrets.MODJO_API_KEY }}
        run: |
          python -m scripts.backfill_team \
            --team "${{ inputs.team }}" \
            --phase "${{ inputs.phase }}" \
            --limit "${{ inputs.limit }}"
