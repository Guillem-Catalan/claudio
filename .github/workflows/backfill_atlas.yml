name: "Backfill Atlas (active pipeline)"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max atlas to process (empty = all)"
        required: false
      model:
        description: "Claude model"
        type: choice
        options:
          - claudio-claude-sonnet-4-6
          - claudio-claude-opus-4-6
        default: claudio-claude-sonnet-4-6
      workers:
        description: "Parallel workers (1-4)"
        type: choice
        options:
          - "1"
          - "3"
          - "4"
        default: "3"
      dry_run:
        description: "Dry run (list targets only)"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Backfill atlas (siblings + structured columns)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: claudio-claude-sonnet-4-6
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          ARGS="$ARGS --model ${{ inputs.model }}"
          ARGS="$ARGS --workers ${{ inputs.workers }}"
          python -m src.pipelines.atlas.backfill $ARGS
