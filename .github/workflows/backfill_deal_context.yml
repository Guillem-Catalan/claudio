name: "Backfill Deal Context"

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Skip first N deals (for resuming)"
        required: false
        default: "0"
        type: string
      limit:
        description: "Max deals to process (0 = all)"
        required: false
        default: "0"
        type: string
      workers:
        description: "Concurrent workers (default 3)"
        required: false
        default: "3"
        type: string
      model:
        description: "Claude model override (e.g. claude-sonnet-4-6)"
        required: false
        default: ""
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build deal_context for deals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ inputs.model || secrets.AZURE_CLAUDE_DEPLOYMENT }}
        run: >-
          python -m scripts.backfill_deal_context
          --offset ${{ inputs.offset }}
          --limit ${{ inputs.limit }}
          --workers ${{ inputs.workers }}
          ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
