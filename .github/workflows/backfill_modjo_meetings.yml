name: "Backfill Missing Modjo Meetings"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max calls to process (empty = all)"
        required: false
      dry_run:
        description: "Dry run (detect only)"
        type: boolean
        default: false
      no_audit:
        description: "Skip audit (insert calls only)"
        type: boolean
        default: false
      workers:
        description: "Parallel audit workers (default 3)"
        required: false
        default: "3"
      call_ids:
        description: "Specific Modjo call IDs (comma-separated, empty = all)"
        required: false
      include_closed:
        description: "Include closed/lost deals (default: open only)"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Backfill Modjo meetings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          MODJO_API_KEY: ${{ secrets.MODJO_API_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ secrets.AZURE_CLAUDE_DEPLOYMENT }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_audit }}" = "true" ]; then ARGS="$ARGS --no-audit"; fi
          if [ -n "${{ inputs.workers }}" ]; then ARGS="$ARGS --workers ${{ inputs.workers }}"; fi
          if [ -n "${{ inputs.call_ids }}" ]; then ARGS="$ARGS --call-ids ${{ inputs.call_ids }}"; fi
          if [ "${{ inputs.include_closed }}" = "true" ]; then ARGS="$ARGS --include-closed"; fi
          python -m scripts.backfill_modjo_meetings $ARGS
