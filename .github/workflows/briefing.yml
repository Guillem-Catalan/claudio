name: "Generate Briefing"

on:
  workflow_dispatch:
    inputs:
      briefing_id:
        description: "Existing briefing row UUID (update in place)"
        required: false
      deal_uuid:
        description: "Deal UUID (creates new briefing row if no briefing_id)"
        required: false
      meeting_type:
        description: "Meeting type override (first_demo, follow_up, meddic_review, pricing, closing, ad_hoc)"
        required: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ secrets.AZURE_CLAUDE_DEPLOYMENT }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.briefing_id }}" ]; then
            ARGS="$ARGS --briefing-id ${{ inputs.briefing_id }}"
          fi
          if [ -n "${{ inputs.deal_uuid }}" ]; then
            ARGS="$ARGS --deal-uuid ${{ inputs.deal_uuid }}"
          fi
          if [ -n "${{ inputs.meeting_type }}" ]; then
            ARGS="$ARGS --meeting-type ${{ inputs.meeting_type }}"
          fi
          python -m scripts.briefing $ARGS
