name: "PAE Follow-Up"

on:
  workflow_dispatch:
    inputs:
      call_ref:
        description: "calls UUID (Supabase)"
        required: true
      channel_override:
        description: "Send to this Slack channel instead of PAE's (for testing)"
        required: false

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (weasyprint)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev

      - run: pip install -r requirements.txt

      - name: Generate follow-up brief
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ secrets.AZURE_CLAUDE_DEPLOYMENT }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PAE_CHANNEL_OVERRIDE: ${{ inputs.channel_override }}
          TL_CHANNEL: ${{ secrets.TL_CHANNEL }}
        run: python -u -m scripts.pae_followup "${{ inputs.call_ref }}"
