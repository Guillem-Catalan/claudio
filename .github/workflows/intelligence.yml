name: Intelligence — Patterns & Calibration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "patterns / calibrate / both"
        type: string
        default: "both"
      month:
        description: "Calibration month YYYY-MM (default: previous month)"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate learned patterns
        if: ${{ inputs.mode == 'patterns' || inputs.mode == 'both' || inputs.mode == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ secrets.AZURE_CLAUDE_DEPLOYMENT }}
        run: python -m scripts.generate_patterns

      - name: Calibrate forecast
        if: ${{ inputs.mode == 'calibrate' || inputs.mode == 'both' || inputs.mode == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.month }}" ]; then ARGS="--month ${{ inputs.month }}"; fi
          python -m scripts.calibrate_forecast $ARGS
