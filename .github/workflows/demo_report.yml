name: Demo Report

on:
  schedule:
    - cron: "0 5 * * 1"  # Monday 7:00 AM Spain (UTC+2)
  workflow_dispatch:
    inputs:
      pae_email:
        description: "Single PAE email (blank = all Santander/Telefónica)"
        required: false
        type: string
      week_start:
        description: "Monday YYYY-MM-DD (blank = previous week)"
        required: false
        type: string
      channel:
        description: "Override Slack channel ID (for testing)"
        required: false
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (weasyprint)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev

      - run: pip install -r requirements.txt

      - name: Generate weekly demo reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          AZURE_CLAUDE_DEPLOYMENT: ${{ secrets.AZURE_CLAUDE_DEPLOYMENT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.pae_email }}" ]; then ARGS="$ARGS --pae-email ${{ inputs.pae_email }}"; fi
          if [ -n "${{ inputs.week_start }}" ]; then ARGS="$ARGS --week-start ${{ inputs.week_start }}"; fi
          if [ -n "${{ inputs.channel }}" ]; then ARGS="$ARGS --channel ${{ inputs.channel }}"; fi
          python -m scripts.demo_report $ARGS
